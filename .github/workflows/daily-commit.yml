name: Daily Commit Workflow

on:
  schedule:
    - cron: '17 9 * * *'   # Runs daily at 09:17 UTC (specific time, no wildcards)
  workflow_dispatch:        # allows manual trigger

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "23f3002424@ds.study.iitm.ac.in"

      - name: Step with email 23f3002424@ds.study.iitm.ac.in
        run: echo "Running daily commit workflow"

      - name: Create daily commit
        run: |
          echo "Last run: $(date)" >> daily-log.txt
          git add daily-log.txt
          git commit -m "Daily automated commit $(date)" || echo "No changes to commit"

      - name: Push changes
        run: git push
