name: Daily Commit Workflow

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Step with email 23f3002424@ds.study.iitm.ac.in
        run: echo "Workflow running"

      - name: Configure Git
        run: |
          git config user.name "23f3002424"
          git config user.email "23f3002424@ds.study.iitm.ac.in"

      - name: Create commit (ALWAYS creates new file)
        run: |
          echo "Run at $(date)" > run-$(date +%s).txt
          git add .
          git commit -m "Daily automated commit $(date)"

      - name: Push commit
        run: git push origin main
