name: Daily Commit Workflow

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write   # ✅ THIS FIXES THE ERROR

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "23f3002424@ds.study.iitm.ac.in"

      - name: Step with email 23f3002424@ds.study.iitm.ac.in
        run: echo "Running workflow"

      - name: Create commit
        run: |
          echo "Last run: $(date)" >> daily-log.txt
          git add daily-log.txt
          git commit -m "Daily commit $(date)" || echo "No changes"

      - name: Push commit
        run: git push
